services:
  ajay-portfolio:
    dns:
      - 8.8.8.8
      - 1.1.1.1
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    user: "root"
    ports:
      - "0.0.0.0:3000:3000"
    env_file:
      - .env.local
    environment:
      NODE_ENV: production
      NODE_OPTIONS: "--dns-result-order=ipv4first" # CRITICAL: Forces Node to prefer IPv4 (127.0.0.1) over IPv6 (::1)
      NEXT_PUBLIC_APP_URL: https://buildwithai.digital
      AUTH_TRUST_HOST: "true"
      AUTH_URL: "https://buildwithai.digital"
      OLLAMA_URL: "http://ollama:11434"
      HOST: "0.0.0.0"
    restart: unless-stopped
    volumes:
      - ./data:/app/data
      - ./content:/app/content
    networks:
      - sovereign-net
    # Removed invalid --host flag, relying on HOST env var and --port
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # 2. UPTIME KUMA (Sovereign Monitoring)
  uptime-kuma:
    image: louislam/uptime-kuma:2
    container_name: uptime-kuma
    restart: unless-stopped
    volumes:
      - ./kuma-data:/app/data
    networks:
      - sovereign-net
    ports:
      - "127.0.0.1:3003:3001"

  # 3. OLLAMA SOVEREIGN AI ENGINE (Optimized for CPU)
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ./ollama-data:/root/.ollama
    networks:
      - sovereign-net
    environment:
      - OLLAMA_NUM_THREADS=2
      - OLLAMA_MAX_LOADED_MODELS=1
      - OLLAMA_FLASH_ATTENTION=1

  # 4. SEARXNG (Sovereign, Privacy-Respecting Metasearch Engine)
  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - SEARXNG_BASE_URL=http://localhost:8080/
      - SEARXNG_SECRET=rj+x3b7hDZRjhmB4nra7iUlpDZmPrLqGkCT08/whvcc=
    volumes:
      - ./searxng-data:/etc/searxng:rw
      - ./searxng-settings.yml:/etc/searxng/settings.yml:ro
    networks:
      - sovereign-net

networks:
  sovereign-net:
    driver: bridge
