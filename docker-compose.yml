services:
  # 1. NEXT.JS CONTROL PLANE
  ajay-portfolio:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    ports:
      - "3000:3000"
    env_file:
      - .env.local
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_APP_URL: https://buildwithai.digital
      AUTH_TRUST_HOST: "true"
      AUTH_URL: "https://buildwithai.digital"
      OLLAMA_URL: "http://ollama:11434" # Internal Docker network URL
    restart: unless-stopped
    volumes:
      - ./data:/app/data
    networks:
      - sovereign-net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # 2. UPTIME KUMA (Sovereign Monitoring)
  uptime-kuma:
    image: louislam/uptime-kuma:2
    container_name: uptime-kuma
    restart: unless-stopped
    volumes:
      - ./kuma-data:/app/data
    networks:
      - sovereign-net
    ports:
      - "127.0.0.1:3003:3001" # Bound to localhost for Nginx reverse proxy security

  # 3. OLLAMA SOVEREIGN AI ENGINE
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    ports:
      - "127.0.0.1:11434:11434" # Secure: Only accessible from host localhost
    volumes:
      - ./ollama-data:/root/.ollama
    networks:
      - sovereign-net
    # Note: If your VPS has an NVIDIA GPU, uncomment the following lines:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

networks:
  sovereign-net:
    driver: bridge
