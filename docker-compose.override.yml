services:
  # Silas Prime Python Backend
  silas-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: silas-backend
    restart: unless-stopped
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - DATABASE_URL=postgresql://silas:secure_password@postgres:5432/silas_prime
    volumes:
      - ./backend:/app/backend
      - ./content:/app/content:ro
      - ./data:/app/data:ro
    networks:
      - sovereign-net
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      - ollama
      - postgres
    healthcheck:
      test: ["CMD", "python", "-c", "import agents.supervisor"]
      interval: 30s
      timeout: 10s
      retries: 3

  # PostgreSQL for Agent Memory & CRM
  postgres:
    image: postgres:16-alpine
    container_name: silas-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: silas_prime
      POSTGRES_USER: silas
      POSTGRES_PASSWORD: secure_password_change_me
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    networks:
      - sovereign-net
    ports:
      - "127.0.0.1:5433:5432"

  # ChromaDB for Vector Memory
  chromadb:
    image: chromadb/chroma:latest
    container_name: silas-chromadb
    restart: unless-stopped
    volumes:
      - ./chroma-data:/chroma/chroma
    networks:
      - sovereign-net
    ports:
      - "127.0.0.1:8001:8000"

  # Langfuse for Observability (Optional)
  langfuse:
    image: langfuse/langfuse:2
    container_name: silas-langfuse
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://silas:secure_password@postgres:5432/langfuse
      SALT: "random_salt_here"
      SECRET_KEY: "random_secret_here"
      NEXTAUTH_SECRET: "random_nextauth_secret"
    networks:
      - sovereign-net
    ports:
      - "127.0.0.1:3004:3000"
    depends_on:
      - postgres